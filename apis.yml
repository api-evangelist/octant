aid: octant
name: Octant
description: >-
  Octant is a precision medicine company developing next-generation small
  molecule therapeutics by merging biology, chemistry, and computation to
  engineer drugs that target complex cellular mechanisms. Its programs span
  protein misfolding and mistrafficking diseases, oncology, metabolism, and
  immunology, with lead candidate OCT-980 — a first-in-disease oral small
  molecule designed to correct protein misfolding for rhodopsin gene mutations
  in autosomal dominant retinitis pigmentosa. Octant is a portfolio company of
  8vc. It publishes no public developer API, developer portal, or technical
  documentation; this profile is maintained in the API Evangelist network as a
  company record.
